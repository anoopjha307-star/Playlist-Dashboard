<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UMA ENTERPRISES - Playlist Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: #111827;
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    header p {
      color: #d1d5db;
      font-size: 15px;
    }

    .container {
      max-width: 950px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    .card h2 {
      margin-bottom: 20px;
      font-size: 22px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      margin-top: 15px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #111827;
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .save-btn {
      width: 100%;
      margin-top: 20px;
      background: #111827;
      color: white;
    }

    .save-btn:hover {
      background: #000;
    }

    .playlist {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
      margin-top: 15px;
      background: #fafafa;
    }

    .platform {
      font-size: 13px;
      font-weight: bold;
      color: #6b7280;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .playlist h3 {
      margin-bottom: 12px;
      font-size: 19px;
    }

    .playlist a {
      color: #2563eb;
      word-break: break-all;
      text-decoration: none;
      font-size: 14px;
    }

    .player {
      margin-top: 18px;
      width: 100%;
    }

    .player iframe {
      width: 100%;
      height: 315px;
      border: none;
      border-radius: 12px;
    }

    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .open-btn {
      background: #2563eb;
      color: white;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 20px;
    }

    .note {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      color: #555;
      font-size: 13px;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #6b7280;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 25px;
      }

      .card {
        padding: 18px;
      }

      .player iframe {
        height: 220px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>UMA ENTERPRISES</h1>
    <p>Playlist Dashboard</p>
  </header>

  <div class="container">

    <div class="card">

      <h2>➕ Add New Playlist</h2>

      <label for="platform">Select Platform</label>

      <select id="platform">
        <option value="Spotify">Spotify</option>
        <option value="YouTube Music">YouTube Music</option>
        <option value="YouTube">YouTube</option>
        <option value="Apple Music">Apple Music</option>
        <option value="Other">Other</option>
      </select>

      <label for="playlistName">Playlist Name</label>

      <input
        type="text"
        id="playlistName"
        placeholder="Example: My Favourite Songs"
      >

      <label for="playlistLink">Playlist Link</label>

      <input
        type="url"
        id="playlistLink"
        placeholder="Paste your playlist link here"
      >

      <button class="save-btn" onclick="savePlaylist()">
        💾 Save Playlist
      </button>

      <div class="note">
        💡 YouTube links can be played directly inside this dashboard.
        Spotify, Apple Music and other links can be opened in their original app/website.
      </div>

    </div>


    <div class="card">

      <h2>🎵 My Playlists</h2>

      <div id="playlistList">
        <div class="empty">
          No playlists saved yet.
        </div>
      </div>

    </div>

  </div>


  <footer>
    UMA ENTERPRISES © 2026
  </footer>


  <script>

    let playlists =
      JSON.parse(localStorage.getItem("umaPlaylists")) || [];


    function savePlaylist() {

      const platform =
        document.getElementById("platform").value;

      const name =
        document.getElementById("playlistName").value.trim();

      const link =
        document.getElementById("playlistLink").value.trim();


      if (name === "" || link === "") {

        alert("Please enter playlist name and link.");

        return;
      }


      try {

        new URL(link);

      } catch (error) {

        alert("Please enter a valid playlist link.");

        return;
      }


      const playlist = {

        id: Date.now(),

        platform: platform,

        name: name,

        link: link

      };


      playlists.push(playlist);


      localStorage.setItem(
        "umaPlaylists",
        JSON.stringify(playlists)
      );


      document.getElementById("playlistName").value = "";

      document.getElementById("playlistLink").value = "";


      displayPlaylists();
    }


    function displayPlaylists() {

      const list =
        document.getElementById("playlistList");


      if (playlists.length === 0) {

        list.innerHTML =
          '<div class="empty">No playlists saved yet.</div>';

        return;
      }


      list.innerHTML = "";


      playlists.forEach(function(playlist) {

        const item =
          document.createElement("div");


        item.className = "playlist";


        let playerHTML = "";


        const youtubeID =
          getYouTubeID(playlist.link);


        if (youtubeID) {

          playerHTML = `
            <div class="player">
              <iframe
                src="https://www.youtube.com/embed/${youtubeID}"
