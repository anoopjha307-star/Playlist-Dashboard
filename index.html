<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UMA ENTERPRISES</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      font-size: 20px;
      color: #ccc;
    }

    button {
      margin-top: 25px;
      padding: 14px 30px;
      border: none;
      border-radius: 8px;
      background: white;
      color: black;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #ddd;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>UMA ENTERPRISES</h1>

    <p>Music Platform</p>

    <p>✅ Website is working!</p>

    <button onclick="alert('UMA Music Platform is working!')">
      TEST BUTTON
    </button>
  </div>

</body>
</html>
