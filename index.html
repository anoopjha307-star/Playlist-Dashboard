<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UMA ENTERPRISES - Music</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f1115;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #151820;
      padding: 20px;
      border-bottom: 1px solid #292d36;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .logo span {
      display: block;
      font-size: 12px;
      color: #a9adb7;
      margin-top: 4px;
      font-weight: normal;
    }

    .admin-btn {
      background: #ffffff;
      color: #111;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .hero {
      max-width: 1100px;
      margin: auto;
      padding: 45px 20px 25px;
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #a9adb7;
      font-size: 15px;
    }

    .search {
      margin-top: 25px;
      width: 100%;
      padding: 15px;
      border: 1px solid #30343e;
      border-radius: 10px;
      background: #191c23;
      color: white;
      outline: none;
      font-size: 15px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .section-title {
      font-size: 24px;
      margin-bottom: 18px;
    }

    .albums {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .album {
      background: #191c23;
      border: 1px solid #292d36;
      border-radius: 15px;
      overflow: hidden;
    }

    .cover {
      width: 100%;
      height: 230px;
      background: linear-gradient(135deg, #292d36, #111318);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .album-content {
      padding: 18px;
    }

    .album-content h3 {
      font-size: 20px;
      margin-bottom: 7px;
    }

    .artist {
      color: #9da2ad;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .buy-btn {
      width: 100%;
      border: none;
      padding: 12px;
      border-radius: 9px;
      background: white;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    .buy-btn:hover {
      background: #ddd;
    }

    .album-page {
      display: none;
      background: #191c23;
      border: 1px solid #292d36;
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .album-top {
      display: flex;
      gap: 25px;
      align-items: center;
      margin-bottom: 25px;
    }

    .album-cover-small {
      width: 180px;
      height: 180px;
      border-radius: 12px;
      overflow: hidden;
      background: #292d36;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 55px;
      flex-shrink: 0;
    }

    .album-cover-small img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .album-info h2 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .album-info p {
      color: #a9adb7;
      margin-bottom: 12px;
    }

    .unlock-box {
      background: #222630;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-top: 20px;
    }

    .unlock-box h3 {
      margin-bottom: 8px;
    }

    .
